.lgx{display:grid;place-items:center;margin-bottom:3vh}.lgx .lg{height:min(30vh,34vw);padding:2.5vh 3vw;border-radius:30px;box-shadow:0 0 80px #3b82ff55,0 0 40px #e6b44c33;animation:rin 1.2s cubic-bezier(.2,.8,.2,1)}
.lgx.sp{position:absolute;inset:0;margin:0;z-index:3;animation:lgo 2.6s forwards}@keyframes lgo{0%{opacity:0}18%{opacity:1}80%{opacity:1}100%{opacity:0;visibility:hidden}}

.lg,.hero .lg,.gt .lg,.lgx .lg{background:none!important;padding:0!important;border-radius:0!important;box-shadow:none!important;filter:drop-shadow(0 0 1px #fff) drop-shadow(0 0 1px #fff) drop-shadow(0 0 10px #ffffff55)}
.rl{display:flex;flex-direction:column;align-items:center;gap:3vh;max-width:min(1400px,92vw);animation:in .6s}.rules{white-space:pre-line;text-align:left;font-size:min(3vw,5.2vh);line-height:1.45;max-height:60vh;overflow:auto;padding:2vh 3vw;border-radius:22px;border:1px solid var(--bd);background:var(--gl);overflow-wrap:anywhere}
.tt2{font-size:min(3.4vw,6vh);color:var(--go);font-weight:700;margin-top:1.5vh;max-width:90vw;overflow-wrap:anywhere}
.wn{flex:1;min-height:0;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:1vh 0 7vh;gap:2vh}.wl{letter-spacing:.35em;color:var(--go);font-weight:800;font-size:min(2.4vw,4vh)}

.wcap{font-size:min(3.6vw,6.4vh);font-weight:800;color:#eef1ff;text-align:center;max-width:92vw;overflow-wrap:anywhere;animation:in .8s}.wcap.b1{font-size:min(5.4vw,10vh);background:linear-gradient(90deg,#8fb4ff,#c4a6ff,var(--go));-webkit-background-clip:text;background-clip:text;color:transparent}
